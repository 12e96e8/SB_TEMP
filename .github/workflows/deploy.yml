name: Deploy SyncBoard websites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SyncBoard_http_React_TS_v01/package-lock.json

      - name: Install React dependencies
        run: npm ci --prefix SyncBoard_http_React_TS_v01

      - name: Build React website
        run: npm run build --prefix SyncBoard_http_React_TS_v01

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          mkdir -p publish/SyncBoard_main_v01
          mkdir -p publish/SyncBoard_v01
          mkdir -p publish/SyncBoard_http_React_TS_v01
          cp -R SyncBoard_main_v01/. publish/SyncBoard_main_v01/
          cp -R SyncBoard_v01/. publish/SyncBoard_v01/
          cp -R SyncBoard_http_React_TS_v01/dist/. publish/SyncBoard_http_React_TS_v01/
          printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0; url=./SyncBoard_main_v01/">' > publish/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
